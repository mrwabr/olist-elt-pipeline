version: 2

models:
  - name: stg_olist__orders
    description: "Une ligne par commande, avec les timestamps du cycle de vie de la commande."
    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved']

  - name: stg_olist__order_items
    description: "Une ligne par article commandé (produit x commande x vendeur)."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__sellers')
              field: seller_id
      - name: price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false

  - name: stg_olist__customers
    description: "Un client Olist (customer_id = identifiant par commande, customer_unique_id = identifiant réel du client)."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_olist__products
    description: "Catalogue produit avec attributs physiques (poids, dimensions)."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_olist__payments
    description: "Paiement(s) associé(s) à une commande."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: stg_olist__reviews
    description: "Avis client (note de 1 à 5) laissé après réception de la commande."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_olist__geolocation
    description: "Position moyenne (lat/lng) par préfixe de code postal."
    columns:
      - name: zip_code_prefix
        tests:
          - unique

  - name: stg_olist__category_translation
    columns:
      - name: product_category_name
        tests:
          - unique